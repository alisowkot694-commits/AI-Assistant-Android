<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14532d"><title>বাংলা দৈনন্দিন সহায়ক</title>
<style>
:root{font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#17251c;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}header{background:#14532d;color:white;padding:22px 18px 18px;border-radius:0 0 22px 22px}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#d8eadc;font-size:14px}.tabs{display:flex;gap:8px;padding:14px;position:sticky;top:0;background:#f3f7f3;z-index:2}.tabs button,.action{border:0;border-radius:12px;padding:11px 13px;background:#e0ebe2;color:#17472b;font-weight:700;font-size:14px}.tabs button.active,.action{background:#166534;color:white}.wrap{padding:0 14px 24px;max-width:650px;margin:auto}.panel{background:white;border:1px solid #e2eae3;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px #163b1b0a}h2{font-size:18px;margin:0 0 12px}input,textarea{width:100%;border:1px solid #cbd8ce;border-radius:11px;padding:12px;font:inherit;font-size:16px;margin:5px 0 10px;background:#fff}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}.item{padding:11px 2px;border-bottom:1px solid #edf1ed;display:flex;gap:9px;align-items:flex-start;overflow-wrap:anywhere}.item:last-child{border:0}.item button{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:6px 9px}.muted{color:#647568;font-size:13px}.result{font-size:24px;font-weight:700;padding:12px;background:#eff7f0;border-radius:10px;min-height:50px;overflow-wrap:anywhere}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keypad button{border:0;border-radius:12px;padding:16px 5px;background:#edf4ee;font-size:20px;font-weight:650;color:#17472b}.keypad button.op{background:#dcefe0}.empty{color:#78867b;text-align:center;padding:15px}
</style></head><body>
<header><h1>বাংলা দৈনন্দিন সহায়ক</h1><p>নোট, কাজের তালিকা ও ক্যালকুলেটর — সহজে, এক জায়গায়</p></header>
<nav class="tabs"><button class="active" data-tab="notes">📝 নোট</button><button data-tab="tasks">☑ কাজ</button><button data-tab="calc">🧮 হিসাব</button></nav>
<main class="wrap">
<section id="notes" class="panel"><h2>নতুন নোট লিখুন</h2><input id="ntitle" placeholder="নোটের শিরোনাম"><textarea id="nbody" placeholder="এখানে আপনার কথা লিখুন..."></textarea><button class="action" id="saveNote">নোট সংরক্ষণ</button><div style="height:10px"></div><h2>সংরক্ষিত নোট</h2><div id="notesList"></div></section>
<section id="tasks" class="panel" hidden><h2>আজকের কাজ</h2><div class="row"><input id="taskInput" placeholder="কী কাজ করতে হবে?"><button class="action" id="addTask" style="flex:0 0 auto">যোগ করুন</button></div><div id="tasksList"></div></section>
<section id="calc" class="panel" hidden><h2>সাধারণ ক্যালকুলেটর</h2><div class="result" id="display">0</div><div style="height:12px"></div><div class="keypad" id="keys"></div><p class="muted">হিসাবের ফল দেখতে = চাপুন।</p></section>
<p class="muted" style="text-align:center">আপনার নোট ও কাজ এই ফোনের ব্রাউজারেই সংরক্ষিত থাকে।</p>
</main>
<script>
const $=id=>document.getElementById(id);let notes=JSON.parse(localStorage.getItem('bdh_notes')||'[]'),tasks=JSON.parse(localStorage.getItem('bdh_tasks')||'[]');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));['notes','tasks','calc'].forEach(id=>$(id).hidden=id!==b.dataset.tab)});
function renderNotes(){$('notesList').innerHTML=notes.length?'':'<div class="empty">এখনো কোনো নোট নেই</div>';notes.forEach((n,i)=>{let d=document.createElement('div');d.className='item';let c=document.createElement('div');c.style.flex='1';let strong=document.createElement('b');strong.textContent=n.title||'শিরোনামহীন নোট';let p=document.createElement('div');p.textContent=n.body;p.style.whiteSpace='pre-wrap';c.append(strong,p);let del=document.createElement('button');del.textContent='মুছুন';del.onclick=()=>{notes.splice(i,1);persist();renderNotes()};d.append(c,del);$('notesList').append(d)})}
function persist(){localStorage.setItem('bdh_notes',JSON.stringify(notes));localStorage.setItem('bdh_tasks',JSON.stringify(tasks))}
$('saveNote').onclick=()=>{let body=$('nbody').value.trim(),title=$('ntitle').value.trim();if(!body&&!title)return;notes.unshift({title,body});persist();$('ntitle').value='';$('nbody').value='';renderNotes()};
function renderTasks(){$('tasksList').innerHTML=tasks.length?'':'<div class="empty">কোনো কাজ যোগ করা হয়নি</div>';tasks.forEach((t,i)=>{let d=document.createElement('div');d.className='item';let cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.style.width='20px';cb.style.margin='2px 0';cb.onchange=()=>{tasks[i].done=cb.checked;persist();renderTasks()};let s=document.createElement('span');s.textContent=t.text;s.style.flex='1';if(t.done)s.style.textDecoration='line-through';let del=document.createElement('button');del.textContent='মুছুন';del.onclick=()=>{tasks.splice(i,1);persist();renderTasks()};d.append(cb,s,del);$('tasksList').append(d)})}
$('addTask').onclick=()=>{let v=$('taskInput').value.trim();if(!v)return;tasks.push({text:v,done:false});$('taskInput').value='';persist();renderTasks()};$('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('addTask').click()});
let expr='';const keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','⌫','+','C','(',')','='];keys.forEach(k=>{let b=document.createElement('button');b.textContent=k;if('÷×−+'.includes(k))b.className='op';b.onclick=()=>press(k);$('keys').append(b)});function press(k){if(k==='C')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='='){try{let e=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');if(!/^[0-9+\-*/().\s]+$/.test(e))throw 0;let v=Function('"use strict";return ('+e+')')();expr=Number.isFinite(v)?String(Math.round(v*1e8)/1e8):'ভুল'}catch{expr='ভুল'}}else if(expr==='ভুল')expr=k;else expr+=k;$('display').textContent=expr||'0'}
renderNotes();renderTasks();
</script></body></html>
