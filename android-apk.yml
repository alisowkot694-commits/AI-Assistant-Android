name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AI-Assistant-Android-BIG-SMALL-Source*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Could not find AI-Assistant-Android-BIG-SMALL-Source*.zip in the repository root."
            echo "Files currently in repository root:"
            ls -la
            exit 1
          fi
          mkdir -p aiassistant_work
          unzip -q "$ZIP_FILE" -d aiassistant_work
          echo "Extracted source archive: $ZIP_FILE"
          find aiassistant_work -maxdepth 3 -type f | head -100

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="aiassistant_work"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            FOUND_SETTINGS="$(find "$PROJECT_DIR" -mindepth 2 -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$FOUND_SETTINGS" ]; then
              echo "Could not find settings.gradle or settings.gradle.kts in extracted source."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
          fi
          echo "Building project in: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-debug-apk
          path: aiassistant_work/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
