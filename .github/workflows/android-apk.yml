name: Build AI Assistant APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          set -eux
          ZIP_FILE="AI-Assistant-Android-BIG-SMALL-Source(1)(1).zip"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f aiassistant_work/settings.gradle.kts
          test -f aiassistant_work/app/build.gradle.kts

      - name: Configure Bengali app, redesigned interface and launcher logo
        run: |
          set -eux
          TARGET="$(find aiassistant_work/app/src/main/java -name MainActivity.kt -print -quit)"
          MANIFEST="aiassistant_work/app/src/main/AndroidManifest.xml"
          test -n "$TARGET"
          mkdir -p aiassistant_work/app/src/main/res/drawable
          cat > "$TARGET" <<'KOTLIN'
          package com.banglaassistant

          import android.app.*
          import android.content.*
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.Executors

          class MainActivity : Activity(), TextToSpeech.OnInitListener {
              private lateinit var answer: TextView
              private lateinit var input: EditText
              private lateinit var statusLabel: TextView
              private lateinit var tts: TextToSpeech
              private var ttsReady = false
              private var selectedVoiceReady = false
              private var pendingSpeech: String? = null
              private var selectedLanguage = "bn"
              private val io = Executors.newSingleThreadExecutor()
              private val prefs by lazy { getSharedPreferences("assistant", MODE_PRIVATE) }
              private val navy = Color.rgb(9, 24, 64)
              private val blue = Color.rgb(27, 91, 220)
              private val cyan = Color.rgb(24, 205, 220)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = navy
                  window.navigationBarColor = navy
                  tts = TextToSpeech(this, this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 18, 18, 18)
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.rgb(7, 20, 55), Color.rgb(19, 56, 117), Color.rgb(8, 34, 79)))
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(18, 20, 18, 20)
                      background = rounded(Color.rgb(18, 67, 145), 26)
                  }
                  header.addView(TextView(this).apply {
                      text = "👑  AI HACK  👑"; textSize = 29f
                      setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                  })
                  header.addView(TextView(this).apply {
                      text = "30 Seconds Color Trading"; textSize = 15f
                      setTextColor(Color.rgb(205, 235, 255)); gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 0)
                  })
                  root.addView(header, LinearLayout.LayoutParams(-1, -2))
                  statusLabel = TextView(this).apply {
                      text = "●  বাংলা কণ্ঠস্বর প্রস্তুত হচ্ছে…"; textSize = 13f
                      setTextColor(Color.rgb(120, 245, 206)); setPadding(4, 14, 4, 10)
                  }
                  root.addView(statusLabel)
                  val answerCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(16, 14, 16, 14)
                      background = rounded(Color.rgb(247, 250, 255), 20)
                  }
                  answerCard.addView(TextView(this).apply {
                      text = "সহকারীর উত্তর"; textSize = 13f; setTextColor(blue)
                      typeface = Typeface.DEFAULT_BOLD
                  })
                  answer = TextView(this).apply {
                      text = "আসসালামু আলাইকুম! আমি আপনার বাংলা AI সহকারী। কীভাবে সাহায্য করতে পারি?"
                      textSize = 17f; setTextColor(Color.rgb(20, 34, 60))
                      setPadding(0, 10, 0, 4)
                  }
                  answerCard.addView(ScrollView(this).apply { addView(answer) },
                      LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(answerCard, LinearLayout.LayoutParams(-1, 0, 1f).apply { bottomMargin = 14 })
                  input = EditText(this).apply {
                      hint = "এখানে বাংলায় লিখুন…"; textSize = 16f; minLines = 2
                      setTextColor(Color.WHITE); setHintTextColor(Color.rgb(190, 210, 235))
                      setPadding(14, 12, 14, 12); background = rounded(Color.rgb(27, 54, 99), 16)
                  }
                  root.addView(input, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 10 })
                  val voiceSend = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  voiceSend.addView(actionButton("🎙  বাংলায় বলুন", cyan) { startVoice() },
                      LinearLayout.LayoutParams(0, 54, 1f).apply { rightMargin = 6 })
                  voiceSend.addView(actionButton("পাঠান  ➤", blue) { askAI(input.text.toString()) },
                      LinearLayout.LayoutParams(0, 54, 1f).apply { leftMargin = 6 })
                  root.addView(voiceSend)
                  val tools = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 10, 0, 0) }
                  tools.addView(actionButton("BIG / SMALL", Color.rgb(35, 132, 112)) { bigSmall() },
                      LinearLayout.LayoutParams(0, 48, 1f).apply { rightMargin = 4 })
                  tools.addView(actionButton("ভাসমান বাটন", Color.rgb(85, 83, 170)) { enableBubble() },
                      LinearLayout.LayoutParams(0, 48, 1f).apply { leftMargin = 4; rightMargin = 4 })
                  tools.addView(actionButton("সার্ভার", Color.rgb(74, 95, 126)) { setServer() },
                      LinearLayout.LayoutParams(0, 48, 1f).apply { leftMargin = 4 })
                  tools.addView(actionButton("অ্যাপ", Color.rgb(39, 123, 149)) { chooseAppToOpen() },
                      LinearLayout.LayoutParams(0, 48, 1f).apply { leftMargin = 4 })
                  root.addView(tools)
                  root.addView(actionButton("🌐 ভাষা নির্বাচন: বাংলা / English", Color.rgb(55, 100, 155)) { chooseLanguage() },
                      LinearLayout.LayoutParams(-1, 48).apply { topMargin = 8 })
                  root.addView(actionButton("🔊 কণ্ঠ পরীক্ষা করুন", Color.rgb(24, 135, 118)) {
                      speak(if (selectedLanguage == "en") "Hello! Your voice is working." else "আসসালামু আলাইকুম। বাংলা কণ্ঠস্বর ঠিকভাবে কাজ করছে।")
                  }, LinearLayout.LayoutParams(-1, 48).apply { topMargin = 8 })
                  setContentView(root)
              }

              private fun rounded(color: Int, radius: Int): GradientDrawable =
                  GradientDrawable().apply { setColor(color); cornerRadius = radius.toFloat() }

              private fun actionButton(label: String, color: Int, action: () -> Unit): Button =
                  Button(this).apply {
                      text = label; textSize = 13f; isAllCaps = false
                      setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD
                      background = rounded(color, 16); setOnClickListener { action() }
                  }

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      runOnUiThread {
                          statusLabel.text = "●  ফোনের কথা বলার সেবা চালু হয়নি"
                          Toast.makeText(this, "ফোনের Text-to-Speech সেবা চালু করা যায়নি।", Toast.LENGTH_LONG).show()
                      }
                      return
                  }
                  ttsReady = true
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) { runOnUiThread { statusLabel.text = "●  উত্তর মুখে বলছে…" } }
                      override fun onDone(id: String?) { runOnUiThread { statusLabel.text = "●  কথা বলা শেষ" } }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { runOnUiThread { statusLabel.text = "●  কণ্ঠস্বর চালু হয়নি" } }
                  })
                  selectedLanguage = prefs.getString("language", "bn") ?: "bn"
                  configureVoice()
                  pendingSpeech?.let { queued -> pendingSpeech = null; speak(queued) }
              }

              private fun configureVoice() {
                  if (!ttsReady) return
                  val locale = Locale.forLanguageTag(if (selectedLanguage == "en") "en-US" else "bn-BD")
                  selectedVoiceReady = false
                  try {
                      // Prefer an installed voice matching the selected language.
                      val voices = tts.voices.orEmpty().filter {
                          it.locale.language.equals(locale.language, ignoreCase = true)
                      }.sortedWith(compareBy<android.speech.tts.Voice> { it.isNetworkConnectionRequired }.thenByDescending { it.quality })
                      val voice = voices.firstOrNull()
                      if (voice != null) {
                          tts.voice = voice
                          // Some engines report a stale tts.language after setting a Voice.
                          selectedVoiceReady = tts.voice?.locale?.language.equals(locale.language, ignoreCase = true)
                      } else {
                          val result = tts.setLanguage(locale)
                          selectedVoiceReady = result >= TextToSpeech.LANG_AVAILABLE &&
                              result != TextToSpeech.LANG_MISSING_DATA &&
                              result != TextToSpeech.LANG_NOT_SUPPORTED
                      }
                  } catch (_: Exception) { selectedVoiceReady = false }
                  runOnUiThread {
                      if (selectedVoiceReady) {
                          statusLabel.text = if (selectedLanguage == "en") "●  English voice ready" else "●  বাংলা কণ্ঠস্বর প্রস্তুত"
                      } else {
                          statusLabel.text = if (selectedLanguage == "en") "●  English voice unavailable" else "●  বাংলা কণ্ঠস্বর ইনস্টল করতে হবে"
                          Toast.makeText(this, if (selectedLanguage == "en") "ফোনে English voice data ইনস্টল করুন।" else "ফোনে বাংলা কণ্ঠস্বর (Bengali voice data) ইনস্টল করুন।", Toast.LENGTH_LONG).show()
                          try { startActivity(Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA)) } catch (_: Exception) {}
                      }
                  }
              }

              private fun chooseLanguage() {
                  val options = arrayOf("বাংলা", "English")
                  AlertDialog.Builder(this).setTitle("অ্যাপের ভাষা নির্বাচন করুন")
                      .setSingleChoiceItems(options, if (selectedLanguage == "en") 1 else 0) { dialog, which ->
                          selectedLanguage = if (which == 1) "en" else "bn"
                          prefs.edit().putString("language", selectedLanguage).apply()
                          dialog.dismiss()
                          configureVoice()
                          show(if (selectedLanguage == "bn") "বাংলা ভাষা নির্বাচন করা হয়েছে। বাংলা উত্তর ও বাংলা কণ্ঠস্বর ব্যবহার হবে।" else "English selected. Replies and voice will use English.")
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun startVoice() {
                  val lang = if (selectedLanguage == "en") "en-US" else "bn-BD"
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, lang)
                      putExtra(RecognizerIntent.EXTRA_ONLY_RETURN_LANGUAGE_PREFERENCE, false)
                      putExtra(RecognizerIntent.EXTRA_PROMPT, if (selectedLanguage == "en") "Speak in English" else "বাংলায় বলুন")
                  }
                  try { startActivityForResult(intent, 410) }
                  catch (_: Exception) { show("এই ফোনে বাংলা ভয়েস ইনপুট সেবা পাওয়া যাচ্ছে না।") }
              }

              @Deprecated("Legacy speech result callback")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 410 && resultCode == RESULT_OK) {
                      val words = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull().orEmpty()
                      input.setText(words)
                      if (words.isNotBlank()) askAI(words)
                  }
              }

              private fun askAI(message: String) {
                  if (openRequestedApp(message)) return
                  if (message.isBlank()) { show("আগে কিছু লিখুন অথবা মাইক্রোফোনে বলুন।"); return }
                  val endpoint = prefs.getString("endpoint", "https://bangla-ai-assistant-backend.onrender.com")!!.trim()
                  show("আপনার প্রশ্নের উত্তর তৈরি হচ্ছে…")
                  io.execute {
                      try {
                          val conn = URL(endpoint.trimEnd('/') + "/chat").openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"; conn.connectTimeout = 20000; conn.readTimeout = 60000
                          conn.doOutput = true; conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                          val useBengali = message.any { it in '\u0980'..'\u09FF' } || selectedLanguage == "bn"
                          val prompt = if (useBengali)
                              "LANGUAGE REQUIREMENT: Reply ONLY in natural Bengali using Bengali script. You are a friendly Bengali voice assistant.\nUser message: " + message
                          else
                              "LANGUAGE REQUIREMENT: Reply in clear natural English. You are a friendly voice assistant.\nUser message: " + message
                          conn.outputStream.use { it.write(JSONObject().put("message", prompt).toString().toByteArray(Charsets.UTF_8)) }
                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val body = stream?.bufferedReader()?.use { it.readText() }.orEmpty()
                          val payload = try { JSONObject(body) } catch (_: Exception) { JSONObject() }
                          var reply = payload.optString("reply").ifBlank { payload.optString("text") }
                          if (code !in 200..299) {
                              val detail = payload.optString("error")
                              reply = if (detail.contains("OPENAI_API_KEY", true))
                                  "AI সার্ভারের চাবি (API Key) এখনো সেট করা হয়নি। তাই AI উত্তর দিতে পারছে না।"
                              else "AI সার্ভারের উত্তর: " + (detail.ifBlank { "HTTP " + code + " — অনুগ্রহ করে Render লগ পরীক্ষা করুন।" })
                          }
                          val bengaliInput = message.any { it in '\u0980'..'\u09FF' }
                          val bengaliReply = reply.any { it in '\u0980'..'\u09FF' }
                          if (bengaliInput && !bengaliReply) reply = "দুঃখিত, এবার বাংলায় উত্তর তৈরি করা যায়নি। আবার চেষ্টা করুন।"
                          if (reply.isBlank()) reply = "দুঃখিত, সার্ভার থেকে উত্তর পাওয়া যায়নি।"
                          runOnUiThread { show(reply); speak(reply) }
                          conn.disconnect()
                      } catch (_: Exception) {
                          runOnUiThread { show("সার্ভারে সংযোগ হয়নি। ইন্টারনেট ও সার্ভার সেটিংস পরীক্ষা করুন।") }
                      }
                  }
              }

              private fun bigSmall() {
                  val field = EditText(this).apply { hint = "যেমন: 3, 8, 1, 6"; textSize = 16f }
                  AlertDialog.Builder(this).setTitle("BIG / SMALL পরিসংখ্যান")
                      .setMessage("আগের ফলাফল লিখুন। ৫–৯ = BIG, ০–৪ = SMALL।")
                      .setView(field).setPositiveButton("বিশ্লেষণ") { _, _ ->
                          val nums = field.text.toString().split(",", " ", "،").mapNotNull { it.trim().toIntOrNull() }.filter { it in 0..9 }
                          if (nums.isEmpty()) { show("সঠিক সংখ্যা পাওয়া যায়নি।"); return@setPositiveButton }
                          val big = nums.count { it >= 5 }; val small = nums.size - big
                          show("মোট ফলাফল: ${nums.size}টি\nBIG: $big\nSMALL: $small\n" +
                              (if (big > small) "আগের ফলাফলে BIG বেশি" else if (small > big) "আগের ফলাফলে SMALL বেশি" else "দুটির সংখ্যা সমান") +
                              "\n\nএটি শুধু অতীতের পরিসংখ্যান; পরের ফলাফলের নিশ্চয়তা নয়।")
                      }.setNegativeButton("বন্ধ", null).show()
              }

              private fun enableBubble() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      show("পরের স্ক্রিনে অন্য অ্যাপের ওপর দেখানোর অনুমতি চালু করে ফিরে আসুন।")
                  } else {
                      startService(Intent(this, FloatingButtonService::class.java))
                      show("ভাসমান AI বাটন চালু হয়েছে।")
                  }
              }

              private fun chooseAppToOpen() {
                  val names = arrayOf("YouTube", "WhatsApp", "Facebook", "Instagram", "Chrome", "Telegram")
                  val packages = arrayOf(
                      "com.google.android.youtube", "com.whatsapp", "com.facebook.katana",
                      "com.instagram.android", "com.android.chrome", "org.telegram.messenger"
                  )
                  AlertDialog.Builder(this).setTitle("কোন অ্যাপ খুলবেন?")
                      .setItems(names) { _, which -> launchApp(packages[which], names[which]) }
                      .setNegativeButton("বন্ধ", null).show()
              }

              private fun launchApp(packageName: String, label: String) {
                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)
                  if (launchIntent == null) {
                      show("$label অ্যাপটি এই ফোনে ইনস্টল করা নেই।")
                      return
                  }
                  try {
                      startActivity(launchIntent)
                      show("$label খুলছি…")
                  } catch (_: Exception) {
                      show("$label অ্যাপ খোলা যায়নি।")
                  }
              }

              private fun openRequestedApp(message: String): Boolean {
                  val text = message.lowercase(Locale.ROOT)
                  val openWords = listOf("খোলো", "খুলে দাও", "চালু কর", "open", "launch")
                  if (openWords.none { text.contains(it) }) return false
                  val apps = listOf(
                      Triple(listOf("youtube", "ইউটিউব", "ইউ টিউব"), "com.google.android.youtube", "YouTube"),
                      Triple(listOf("whatsapp", "হোয়াটসঅ্যাপ", "হোয়াটসঅ্যাপ", "হোয়াটস অ্যাপ"), "com.whatsapp", "WhatsApp"),
                      Triple(listOf("facebook", "ফেসবুক"), "com.facebook.katana", "Facebook"),
                      Triple(listOf("instagram", "ইনস্টাগ্রাম"), "com.instagram.android", "Instagram"),
                      Triple(listOf("chrome", "ক্রোম"), "com.android.chrome", "Chrome"),
                      Triple(listOf("telegram", "টেলিগ্রাম"), "org.telegram.messenger", "Telegram")
                  )
                  val selected = apps.firstOrNull { app -> app.first.any { text.contains(it) } } ?: return false
                  launchApp(selected.second, selected.third)
                  return true
              }

              private fun setServer() {
                  val field = EditText(this).apply {
                      hint = "Backend URL"
                      setText(prefs.getString("endpoint", "https://bangla-ai-assistant-backend.onrender.com"))
                  }
                  AlertDialog.Builder(this).setTitle("AI সার্ভার ঠিকানা")
                      .setMessage("ব্যাকএন্ড URL দিন। OpenAI API Key এখানে দেবেন না।")
                      .setView(field).setPositiveButton("সংরক্ষণ") { _, _ ->
                          prefs.edit().putString("endpoint", field.text.toString().trim()).apply()
                          show("সার্ভার ঠিকানা সংরক্ষণ হয়েছে।")
                      }.setNegativeButton("বাতিল", null).show()
              }

              private fun show(text: String) { answer.text = text }
              private fun speak(text: String) {
                  if (!ttsReady) { pendingSpeech = text; return }
                  if (!selectedVoiceReady) {
                      statusLabel.text = "●  কণ্ঠস্বর পাওয়া যায়নি—ভাষা সেটিংস পরীক্ষা করুন"
                      Toast.makeText(this, "নির্বাচিত ভাষার কণ্ঠস্বর ফোনে ইনস্টল নেই। ভাষা নির্বাচন থেকে আবার চেষ্টা করুন।", Toast.LENGTH_LONG).show()
                      return
                  }
                  val utteranceId = "assistant_reply_" + System.currentTimeMillis()
                  val result = tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, utteranceId)
                  if (result == TextToSpeech.ERROR) {
                      statusLabel.text = "●  কথা বলা যায়নি"
                      Toast.makeText(this, "কণ্ঠস্বর চালু করতে সমস্যা হয়েছে।", Toast.LENGTH_LONG).show()
                  }
              }
              override fun onDestroy() {
                  if (::tts.isInitialized) tts.shutdown()
                  io.shutdownNow()
                  super.onDestroy()
              }
          }
          KOTLIN
          cat > aiassistant_work/app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
