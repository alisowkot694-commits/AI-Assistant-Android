name: Build AI Assistant APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          set -eux
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AI-Assistant-Android-BIG-SMALL-Source*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f aiassistant_work/settings.gradle.kts
          test -f aiassistant_work/app/build.gradle.kts

      - name: Configure deployed backend URL
        run: |
          set -eux
          TARGET="$(find aiassistant_work/app/src/main/java -name MainActivity.kt -print -quit)"
          test -n "$TARGET"
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s = s.replace("https://your-backend.example.com", "https://bangla-ai-assistant-backend.onrender.com")
          old_request = 'conn.outputStream.use { it.write(JSONObject().put("message", message).toString().toByteArray(Charsets.UTF_8)) }'
          new_request = """val languageInstruction = "IMPORTANT LANGUAGE RULE: Detect the language of the user's message. If it is Bengali, you MUST answer ONLY in natural Bengali using বাংলা script. Never answer a Bengali message in English. Keep the answer clear and simple. If the user explicitly requests another language, use that language."
                val requestMessage = languageInstruction + "\\n\\nUser message: " + message
                conn.outputStream.use { it.write(JSONObject().put("message", requestMessage).toString().toByteArray(Charsets.UTF_8)) }"""
          if old_request in s:
              s = s.replace(old_request, new_request)
          # Strengthen Bengali speech output and report missing device language data instead of silently speaking English.
          old_tts = 'if (status == TextToSpeech.SUCCESS) tts.language = Locale("bn", "BD")'
          new_tts = """if (status == TextToSpeech.SUCCESS) {
                  var languageStatus = tts.setLanguage(Locale.forLanguageTag("bn-BD"))
                  if (languageStatus == TextToSpeech.LANG_MISSING_DATA || languageStatus == TextToSpeech.LANG_NOT_SUPPORTED) {
                      languageStatus = tts.setLanguage(Locale.forLanguageTag("bn-IN"))
                  }
                  if (languageStatus == TextToSpeech.LANG_MISSING_DATA || languageStatus == TextToSpeech.LANG_NOT_SUPPORTED) {
                      runOnUiThread {
                          Toast.makeText(this, "বাংলা কণ্ঠস্বর চালাতে ফোনে Bengali TTS voice data ইনস্টল করুন।", Toast.LENGTH_LONG).show()
                          try { startActivity(Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA)) } catch (_: Exception) {}
                      }
                  }
              }"""
          if old_tts in s:
              s = s.replace(old_tts, new_tts)
          s = s.replace('prefs.getString("endpoint", "")!!.trim()', 'prefs.getString("endpoint", "https://bangla-ai-assistant-backend.onrender.com")!!.trim()')
          s = s.replace('setText(prefs.getString("endpoint", ""))', 'setText(prefs.getString("endpoint", "https://bangla-ai-assistant-backend.onrender.com"))')
          old = 'val reply = JSONObject(body).optString("reply", "উত্তর পাওয়া যায়নি।")'
          new = 'val payload = JSONObject(body)\n                val reply = payload.optString("reply").ifBlank { payload.optString("error", "উত্তর পাওয়া যায়নি।") }'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          assert "bangla-ai-assistant-backend.onrender.com" in s, "Backend URL was not found/configured in MainActivity"
          print(f"Configured backend in {p}")
          PY

      - name: Package unpacked source for implementation review
        run: |
          set -eux
          mkdir -p source-review
          cp -R aiassistant_work/app/src source-review/
          cp aiassistant_work/settings.gradle.kts source-review/
          cp aiassistant_work/build.gradle.kts source-review/ 2>/dev/null || true
          cd source-review
          zip -qr ../android-source-review.zip .
      - name: Upload source review
        uses: actions/upload-artifact@v4
        with:
          name: android-source-review
          path: android-source-review.zip
          if-no-files-found: error
          retention-days: 3

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > aiassistant_work/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.banglaassistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aiassistant.app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle project
        run: gradle --no-daemon -p aiassistant_work :app:tasks --all

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p aiassistant_work clean :app:assembleDebug

      - name: Verify APK output
        run: test -s aiassistant_work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-debug-apk
          path: aiassistant_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
