name: Build AI Assistant APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          set -eux
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AI-Assistant-Android-BIG-SMALL-Source*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f aiassistant_work/settings.gradle.kts
          test -f aiassistant_work/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle project
        run: gradle --no-daemon -p aiassistant_work :app:tasks --all

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p aiassistant_work clean :app:assembleDebug

      - name: Verify APK output
        run: test -s aiassistant_work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-debug-apk
          path: aiassistant_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
