          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path("aiassistant_work/app/src/main/AndroidManifest.xml")
          s=p.read_text(encoding="utf-8")
          s=s.replace('<application ', '<application android:icon="@drawable/ic_launcher" ')
          p.write_text(s, encoding="utf-8")
          source=Path("aiassistant_work/app/src/main/java/com/banglaassistant/MainActivity.kt").read_text(encoding="utf-8")
          assert 'chooseLanguage()' in source
          assert 'UtteranceProgressListener' in source
          assert 'selectedVoiceReady' in source
          assert 'Reply ONLY in natural Bengali' in source
          assert 'ic_launcher' in p.read_text(encoding="utf-8")
          print("Language picker, spoken-reply callbacks, Bengali voice selection, redesigned UI and launcher icon verified.")
          PY

      - name: Package unpacked source for implementation review
        run: |
          set -eux
          mkdir -p source-review
          cp -R aiassistant_work/app/src source-review/
          cp aiassistant_work/settings.gradle.kts source-review/
          cp aiassistant_work/build.gradle.kts source-review/ 2>/dev/null || true
          cd source-review
          zip -qr ../android-source-review.zip .
      - name: Upload source review
        uses: actions/upload-artifact@v4
        with:
          name: android-source-review
          path: android-source-review.zip
          if-no-files-found: error
          retention-days: 3

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > aiassistant_work/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.banglaassistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aiassistant.app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle project
        run: gradle --no-daemon -p aiassistant_work :app:tasks --all

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p aiassistant_work clean :app:assembleDebug

      - name: Verify APK output
        run: test -s aiassistant_work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-debug-apk
          path: aiassistant_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
