              tag=f'<uses-permission android:name="{permission}" />'
              if tag not in manifest_text:
                  manifest_text=manifest_text.replace("<application", tag+"\\n    <application", 1)
          if "FloatingButtonService" not in manifest_text:
              manifest_text=manifest_text.replace("</application>", '''<service
                      android:name=".FloatingButtonService"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Persistent floating AI assistant overlay" />
                  </service>
              </application>''')
          manifest_path.write_text(manifest_text, encoding="utf-8")
          print("Installed 88dp draggable floating AI HACK bubble, WAIT-first overlay card, and persistent foreground service.")
          source=next(Path("aiassistant_work/app/src/main/java").rglob("MainActivity.kt")).read_text(encoding="utf-8")
          assert 'chooseLanguage()' in source
          assert 'UtteranceProgressListener' in source
