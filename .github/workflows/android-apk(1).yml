name: Build AI Assistant APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          set -eux
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AI-Assistant-Android-BIG-SMALL-Source*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          test -f aiassistant_work/settings.gradle.kts
          test -f aiassistant_work/app/build.gradle.kts

      - name: Configure backend and capture Android source
        run: |
          set -eux
          TARGET="aiassistant_work/app/src/main/java/com/aiassistant/app/MainActivity.kt"
          test -f "$TARGET"
          grep -RIl 'https://your-backend.example.com' aiassistant_work/app/src/main/java --include='*.kt' | xargs -r sed -i 's#https://your-backend.example.com#https://bangla-ai-assistant-backend.onrender.com#g'
          mkdir -p source-review
          cp -R aiassistant_work/app/src source-review/
          cp aiassistant_work/settings.gradle.kts source-review/
          cp aiassistant_work/app/build.gradle.kts source-review/
          cd source-review
          zip -qr ../android-source-review.zip .
      - name: Upload Android source for implementation review
        uses: actions/upload-artifact@v4
        with:
          name: android-source-review
          path: android-source-review.zip
          if-no-files-found: error
          retention-days: 3

      - name: Fix Java and Kotlin JVM target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("aiassistant_work/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          match = re.search(r"(?m)^android\\s*\\{", text)
          if not match:
              raise SystemExit("Could not find android { } block")
          block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if re.search(r"(?m)^\\s*compileOptions\\s*\\{", text):
              text = re.sub(
                  r"(?ms)^([ \\t]*)compileOptions\\s*\\{.*?^\\1\\}",
                  lambda m: m.group(1) + "compileOptions {\\n"
                    + m.group(1) + "    sourceCompatibility = JavaVersion.VERSION_17\\n"
                    + m.group(1) + "    targetCompatibility = JavaVersion.VERSION_17\\n"
                    + m.group(1) + "}",
                  text, count=1
              )
          else:
              text = text[:match.end()] + block + text[match.end():]
          path.write_text(text, encoding="utf-8")
          print("Java source/target set to JVM 17")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle project
        run: gradle --no-daemon -p aiassistant_work :app:tasks --all

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p aiassistant_work clean :app:assembleDebug

      - name: Verify APK output
        run: test -s aiassistant_work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-debug-apk
          path: aiassistant_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
