name: Build Native Bangla AI Assistant APK (Fixed)

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Assistant-Android-BIG-SMALL-Source(1)(1).zip"
      - ".github/workflows/build-native-android-fixed.yml"
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack native Android source
        run: |
          set -eux
          unzip -o "AI-Assistant-Android-BIG-SMALL-Source(1)(1).zip" -d .
          test -f aiassistant_work/settings.gradle.kts
          test -f aiassistant_work/app/src/main/java/com/banglaassistant/MainActivity.kt
          test -f aiassistant_work/app/src/main/java/com/banglaassistant/FloatingButtonService.kt
          ! grep -R "android.webkit.WebView" aiassistant_work/app/src/main/java

      - name: Align Java and Kotlin JVM targets
        run: |
          cat > aiassistant_work/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.banglaassistant"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.banglaassistant"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build native debug APK
        run: gradle --no-daemon --stacktrace -p aiassistant_work clean :app:assembleDebug

      - name: Verify and stage APK
        run: |
          test -s aiassistant_work/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p native-apk
          cp aiassistant_work/app/build/outputs/apk/debug/app-debug.apk native-apk/Bangla-AI-Assistant-native-debug.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-AI-Assistant-native-debug-apk
          path: native-apk/Bangla-AI-Assistant-native-debug.apk
          if-no-files-found: error
          retention-days: 14
